          <div class="mascot-crop">
            <img class="sprite-still" src="media/mascot-still.png" alt="" width="90" height="110">

              <img class="sprite-ready" src="media/mascot-ready.png" alt="" width="90" height="660">

          </div>
        </div>
      </div>

          </div>
          <div class="share-group">

      <div class="cli-prose">
        <figure class="cli-demo">
          <div class="cli-media cli-media--home demo-frame">
            <div class="cli-window" style="--window-ratio: 1796 / 1192; --window-ratio-mobile: 814 / 1142">
              <video id="cli-home" aria-label="Alive5 CLI Home demo" aria-describedby="cli-home-description" width="1796" height="1192" muted playsinline preload="none" data-media="media/cli-home" data-avc="avc1.64002a" data-avc-mobile="avc1.640020"></video>
              <picture class="demo-poster">
                <source data-result="(max-width: 639px)" media="(max-width: 639px) and (prefers-reduced-motion: reduce)" srcset="media/cli-home-m-result.jpg" width="814" height="1142">
                <source data-result="all" media="(prefers-reduced-motion: reduce)" srcset="media/cli-home-result.jpg">
                <source media="(max-width: 639px)" srcset="media/cli-home-m-poster.jpg" width="814" height="1142">

              </picture>
            </div>
            <span id="cli-home-description" hidden>Alive5 CLI Home with the workspace menu and recent conversations.</span>
            <button type="button" class="demo-toggle" aria-controls="cli-home" aria-label="Play Alive5 CLI Home demo" aria-pressed="false" hidden></button>
          </div>

              <picture class="demo-poster">
                <source data-result="(max-width: 639px)" media="(max-width: 639px) and (prefers-reduced-motion: reduce)" srcset="media/cli-reply-m-result.jpg" width="814" height="1218">
                <source data-result="all" media="(prefers-reduced-motion: reduce)" srcset="media/cli-reply-result.jpg">
                <source media="(max-width: 639px)" srcset="media/cli-reply-m-poster.jpg" width="814" height="1218">

            <button type="button" class="demo-toggle" aria-controls="cli-reply" aria-label="Play Alive5 CLI reply demo" aria-pressed="false" hidden></button>
          </div>
          <figcaption class="cli-caption">Open a conversation and send a reply.</figcaption>

              <picture class="demo-poster">

          </div>
