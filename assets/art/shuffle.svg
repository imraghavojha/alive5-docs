<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" fill="none" stroke="#202534" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
<title>Shuffle and Alive5 SMS — an exploded security automation appliance</title>
<desc>A vented 1U rack cover lifts off its mainboard, RJ45 port bank and base tray. An orange Alive5 SMS app cartridge slides into an expansion bay on a dashed assembly axis. Above, cabled trigger, list channels, condition, and Alive5 SMS workflow modules illustrate an automation. Check code and error in the response body, even when HTTP status is 200.</desc>
