<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
<title id="title">Alive5 SMS — a modular n8n workflow</title>
<desc id="desc">An isometric schedule slab, orange SMS send block, and phone with a message follow a dotted path across a lavender-grey background.</desc>
