<rect x="92" y="10" width="88" height="72" rx="3" fill="#fff"/>
<path d="M95 10h82a3 3 0 0 1 3 3v12H92V13a3 3 0 0 1 3-3Z" fill="#fff2eb" stroke-width=".8"/>
<circle cx="99" cy="18" r="2" fill="#c34c27" stroke="none"/>
<text class="type" x="105" y="20.5" font-size="7.5">Alive5</text>
<path class="detail" d="M160 18h5m6-2 4 4m0-4-4 4"/>
<path d="M101 32h58v16h-52l-6 4v-4h-3V35a3 3 0 0 1 3-3Z" fill="#f3f5f9" stroke-width=".8"/>
<path class="detail" d="M104 38h47m-47 5h35"/>
<path d="M118 53h54v13h-49l-5-4Z" fill="#fff2eb" stroke-width=".8"/>
<path class="detail" d="M124 58h40m-40 4h28M92 71h88"/>
<rect x="98" y="75" width="75" height="4" rx="1.5" fill="#f3f5f9" stroke-width=".8"/>
<circle cx="168" cy="102" r="11" fill="#c34c27"/>
<path d="M163 98h10v7h-5l-4 3v-3h-1Z" stroke="#fff" stroke-width="1.2"/>
<path d="M166 101h4" stroke="#fff" stroke-width=".8"/>
</g>
<!-- Leaders stay outside the stack; the data attribute belongs to the script cartridge. -->
<g class="detail"><path d="M65 53h168l48 27"/><circle cx="281" cy="80" r="2.3" fill="#f6f9fc"/>
<path d="M65 212h187l66.9-73"/><circle cx="318.9" cy="139" r="2.3" fill="#f6f9fc"/>
<path d="M634.65 94.4H686l23-11.4h185"/><circle cx="634.65" cy="94.4" r="2.3" fill="#f6f9fc"/></g>
<text class="label" x="65" y="41">a5app.js · ASYNC</text>
<text class="label" x="65" y="200">data-widget_code_id</text>
<text class="label" x="709" y="71" style="fill:#c34c27">Z-INDEX · TOPMOST LAYER</text>
</svg>
