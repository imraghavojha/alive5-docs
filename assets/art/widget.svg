<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" fill="none" stroke="#202534" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round">
<title>Installing Alive5 — browser, page, and topmost widget layer</title>
<desc>Three 16:10 website layers separate along vertical corner axes. One script cartridge inserts into the page head. The top overlay contains a chat panel and its launcher, both inside the layer boundary.</desc>
<defs>
<style>path,rect,circle,ellipse,line,polyline{vector-effect:non-scaling-stroke}.detail{stroke:#657080;stroke-width:.8}.guide{stroke:#9aa3b2;stroke-width:.8;stroke-dasharray:4 4}.label{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;letter-spacing:.06em;fill:#202534;stroke:none}.type{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;fill:#202534;stroke:none}</style>
<g id="register" class="detail"><circle r="2.2" fill="#fff"/><path d="M-1 0h2M0-1v2"/></g>
<g id="image" class="detail"><rect width="68" height="26" rx="1" fill="#fff"/><path d="m0 0 68 26M68 0 0 26"/><circle cx="12" cy="8" r="2.4"/></g>
<g id="contact" class="detail"><rect width="3" height="7" rx=".4" fill="#e7ebf1"/></g>
</defs>
<rect width="960" height="400" fill="#f6f9fc" stroke="none"/>
<!-- Matching corners on every plane remain on four vertical assembly axes. -->
<g class="guide"><path d="M485 8v232M634.65 94.4v232M391.47 62v232M541.12 148.4v232"/></g>
<!-- Browser: a true 192 by 120 window; chrome occupies its back/top edge. -->
<path d="m391.47 294 149.65 86.4v6l-149.65-86.4Z" fill="#f3f5f9"/>
<path d="m541.12 380.4 93.53-54v6l-93.53 54Z" fill="#e7ebf1"/>
<g transform="matrix(.77942286 .45 -.77942286 .45 485 240)">
<rect width="192" height="120" rx="3" fill="#fff"/>
<path d="M3 0h186a3 3 0 0 1 3 3v27H0V3a3 3 0 0 1 3-3Z" fill="#f3f5f9" stroke-width=".8"/>
<path d="M8 14V6a2 2 0 0 1 2-2h54a2 2 0 0 1 2 2v8" fill="#fff" stroke-width=".8"/>
<rect x="14" y="7" width="4" height="4" rx=".5" fill="#e7ebf1" stroke-width=".8"/>
<path class="detail" d="M23 9h27m6-2 4 4m0-4-4 4M71 9h6m-3-3v6M158 8h4m10-2h5v5h-5m11-5 4 5m0-5-4 5M0 14h192"/>
<path class="detail" d="m10 19-3 3 3 3m-3-3h10m8-3 3 3-3 3m3-3h-8M36 19a3 3 0 1 0 1 5m0-5v3h-3"/>
<rect x="45" y="17" width="127" height="10" rx="4" fill="#fff" stroke-width=".8"/>
<path class="detail" d="M52 22v-2a2 2 0 0 1 4 0v2m-4 0h4v3h-4Z"/>
<text class="type" x="61" y="24" font-size="6.5">https://</text><path class="detail" d="M99 22h38M180 19v6m3-6v6"/>
<rect x="6" y="35" width="174" height="79" rx="1" fill="#f3f5f9" stroke-width=".8"/>
<path class="detail" d="M12 41h162M12 108h162M12 46v56M174 46v56"/>
<rect x="184" y="35" width="3" height="79" rx="1.5" fill="#fff" stroke-width=".8"/>
<rect x="184" y="47" width="3" height="22" rx="1.5" fill="#e7ebf1" stroke-width=".8"/>
<use href="#register" x="12" y="108"/><use href="#register" x="174" y="108"/>
</g>
<!-- Page sheet: the head is part of the page, followed by nav and wireframe content. -->
<path d="m391.47 178 149.65 86.4v4l-149.65-86.4Z" fill="#f3f5f9"/>
<path d="m541.12 264.4 93.53-54v4l-93.53 54Z" fill="#e7ebf1"/>
<g transform="matrix(.77942286 .45 -.77942286 .45 485 124)">
<rect width="192" height="120" rx="2" fill="#fff"/>
<rect x="9" y="7" width="174" height="16" rx="1" fill="#f3f5f9" stroke-width=".8"/>
<text class="type" x="66" y="18" font-size="8">&lt;head&gt;</text>
<rect x="14" y="12" width="42" height="6" rx="1" fill="#e7ebf1" stroke-width=".8"/>
<path class="detail" d="M18 14h34m-34 2h34M119 13h20m-20 4h12M154 15h21"/>
<rect x="9" y="29" width="174" height="12" rx="1" fill="#fff" stroke-width=".8"/>
<rect x="14" y="33" width="18" height="4" rx=".6" fill="#e7ebf1" stroke-width=".8"/>
<path class="detail" d="M105 35h16m7 0h16m7 0h21"/>
