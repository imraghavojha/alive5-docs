<path class="detail" d="M10 111h51m55 0h51M83 84h25m-25 5h20m-20 5h25m-25 5h16"/>
</g>
<!-- One insertion axis links the cartridge to the page's head socket. -->
<path class="detail" d="M356.13 132.5h81l47.09 4.55"/>
<!-- Script cartridge floats to the left of the stack. -->
<path d="m239.22 88 96.99 56v5l-96.99-56Z" fill="#f3f5f9"/>
<path d="m336.21 144 27.71-16v5l-27.71 16Z" fill="#e7ebf1"/>
<g transform="matrix(.8660254 .5 -.8660254 .5 267.8 71.5)">
<rect width="112" height="33" rx="1" fill="#fff"/>
<rect x="5" y="5" width="102" height="23" rx="1" fill="#f3f5f9" stroke-width=".8"/>
<text class="type" x="12" y="20" font-size="11">&lt;script&gt;</text>
<path class="detail" d="M12 24h52M86 12h13m-13 5h8"/>
<use href="#contact" x="86" y="28"/><use href="#contact" x="92" y="28"/><use href="#contact" x="98" y="28"/>
</g>
<!-- Topmost overlay sheet: the panel and launcher share a single bounded layer. -->
<path d="m391.47 62 149.65 86.4v4l-149.65-86.4Z" fill="#f3f5f9"/>
<path d="m541.12 148.4 93.53-54v4l-93.53 54Z" fill="#e7ebf1"/>
<g transform="matrix(.77942286 .45 -.77942286 .45 485 8)">
<rect width="192" height="120" rx="2" fill="#fff"/>
<path class="detail" d="M18 7H7v11M174 7h11v11M185 102v11H174M18 113H7V102"/>
<use href="#register" x="0" y="0"/><use href="#register" x="192" y="0"/>
<use href="#register" x="0" y="120"/><use href="#register" x="192" y="120"/>
