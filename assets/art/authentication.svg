  <title>Authentication — exploded API key appliance</title>
  <desc>An API-key card and X-A5-APIKEY header plate above a vented lid, populated circuit board, and open api.alive5.com base tray. Floating screws follow the assembly axes. Keep the key server-side and use HTTPS.</desc>
