<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" fill="none" stroke="#202534" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
<title>Node-RED + Alive5 — exploded single-board computer and SMS HAT</title>
<desc>A vented enclosure lid, GPIO-equipped single-board computer and case base. An orange SMS HAT beside it is exploded into its modem shield, SIM card and antenna, with mounting standoffs and assembly guides. Two curved flow wires connect the board to nodes engraved alive5 sms in and alive5 send sms.</desc>
