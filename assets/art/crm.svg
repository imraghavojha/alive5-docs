<title>CRM integrations — conversations mapped into CRM records</title>
<desc>An exploded isometric records cabinet with Lead, Contact, and Account drawers. An Alive5 conversation feeds a patch panel mapping PHONE to telephone1, EMAIL to emailaddress1, and ACCOUNT ID to a field by API name. Patch cables connect mapped values to record cards; a transcript is attached as a note or task.</desc>
