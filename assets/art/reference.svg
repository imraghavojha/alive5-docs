<title>Anatomy of an Alive5 API call</title>
<desc>An exploded isometric hardware assembly reads from host to path, API key header, form body, and response. Two host slots are labelled api and api-v2. An orange key insert fits the X-A5-APIKEY cartridge. The HTTP 200 response tray separates the real body envelope into code, data, and error.</desc>
