name: Sync Notion docs

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: notion-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: notion/package-lock.json
      - run: npm ci --prefix notion --omit=dev
      - name: Read Notion and build static pages
        run: npm run build --prefix notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_ROOT_PAGE_ID: ${{ secrets.NOTION_ROOT_PAGE_ID }}
      - name: Commit changed output
        shell: bash
        run: |
          git add -A -- '*.html' assets/site.js assets/search-index.json notion/map.json
          if [ -d assets/notion ]; then git add -A -- assets/notion; fi
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Sync docs from Notion'
          git push origin HEAD:main
      - name: Request a Pages build
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          latest=$(gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest" --jq '[.commit, .status] | @tsv') || latest=''
          IFS=$'\t' read -r commit status <<< "$latest"
          if [ "$commit" != "$main" ] || [[ ! "$status" =~ ^(built|building|queued)$ ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
          fi
