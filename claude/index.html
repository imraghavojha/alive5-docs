<!doctype html>
<html lang="en">
<head>
  <!-- Opt into view transitions before linked styles load. -->
  <style>@media (prefers-reduced-motion: no-preference) { @view-transition { navigation: auto; } }</style>
  <script>(()=>{let t;try{t=localStorage.getItem("a5-theme")}catch{}document.documentElement.dataset.theme=t==="light"||t==="dark"?t:matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"})();</script>
  <script>
    try {
      const until = Number(sessionStorage.getItem("alive5-ink-arrival"));
      sessionStorage.removeItem("alive5-ink-arrival");
      if (until > Date.now() && !matchMedia("(prefers-reduced-motion: reduce)").matches)
        document.documentElement.classList.add("ink-arrival");
    } catch {}
  </script>
  <meta name="color-scheme" content="light dark">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alive5 for Claude</title>
  <meta name="description" content="Manage your Alive5 inbox with Claude.">
  <link rel="icon" type="image/png" sizes="48x48" href="../assets/images/favicon.png">
  <link rel="stylesheet" href="../assets/styles.css">
  <link rel="stylesheet" href="claude.css">
  <link rel="stylesheet" href="../assets/clawd-button.css">
  <script src="../assets/clawd-button.js" defer></script>
  <script src="../assets/site.js" defer></script>
  <link rel="canonical" href="https://imraghavojha.github.io/alive5-docs/claude/">
  <meta property="og:title" content="Alive5 for Claude">
  <meta property="og:description" content="Manage your Alive5 inbox with Claude.">
  <meta property="og:url" content="https://imraghavojha.github.io/alive5-docs/claude/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Alive5 Docs">
  <meta property="og:image" content="https://imraghavojha.github.io/alive5-docs/assets/images/og.png">
</head>
<body data-root="../">
  <a class="skip" href="#main">Skip to content</a>
  <header data-header></header>

  <main id="main" class="hero claude-hero">
    <span class="dots" aria-hidden="true"></span>
    <div class="wrap hero-in claude-content">
      <h1>Alive5 for Claude</h1>
      <p class="tagline">Manage your Alive5 inbox with Claude.</p>

      <div class="keycard claude-setup">
        <div>
          <span class="clawd-button" data-clawd="perched"><img class="clawd-sprite" src="../assets/images/clawd.svg" width="54" height="30" alt="" draggable="false"><a class="btn-primary" href="https://claude.ai/customize/connectors?modal=add-custom-connector&amp;connectorName=Alive5&amp;connectorUrl=https%3A%2F%2Fwmbb2krgd4yqmghwsxd3yamzey0ocqsz.lambda-url.us-east-1.on.aws%2Fv1%2Fclaude%2Fmcp" target="_blank" rel="noopener">Add to Claude <span aria-hidden="true">›</span></a></span>
          <p class="claude-note">Have your Alive5 API key ready. <a href="https://app-prod.alive5.com/integrations" target="_blank" rel="noopener">Find it</a></p>
        </div>
        <details class="claude-server">
          <summary>Server URL</summary>
          <div class="claude-url">
            <code id="server-url">https://wmbb2krgd4yqmghwsxd3yamzey0ocqsz.lambda-url.us-east-1.on.aws/v1/claude/mcp</code>
            <button type="button" class="copy" id="copy" aria-live="polite">Copy</button>
          </div>
        </details>
      </div>
    </div>
  </main>
  <script>
    const copy = document.getElementById("copy");
    const serverURL = document.getElementById("server-url");
    let resetCopy;
    copy.addEventListener("click", async () => {
      clearTimeout(resetCopy);
      try {
        await navigator.clipboard.writeText(serverURL.textContent);
        copy.textContent = "Copied";
      } catch {
        copy.textContent = "Select and copy";
      }
      resetCopy = setTimeout(() => { copy.textContent = "Copy"; }, 1600);
    });
  </script>
</body>
</html>
